version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: doctorchat-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - doctorchat
    depends_on:
      - db
      - redis

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: doctorchat-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - doctorchat
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: doctorchat-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-doctorchat}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - doctorchat
    ports:
      - "3306:3306"

  # Redis
  redis:
    image: redis:alpine
    container_name: doctorchat-redis
    restart: unless-stopped
    networks:
      - doctorchat
    ports:
      - "6379:6379"

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: doctorchat-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - doctorchat
    depends_on:
      - app
      - redis

  # ─── RAG Service ──────────────────────────────────────────────────────

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: doctorchat-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - doctorchat

  # Multi-Tenant RAG Server
  rag-server:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: doctorchat-rag-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - COLAB_TUNNEL_URL=${COLAB_TUNNEL_URL:-}
    depends_on:
      - qdrant
    networks:
      - doctorchat

volumes:
  db_data:
  qdrant_data:

networks:
  doctorchat:
    driver: bridge
